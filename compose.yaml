services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - knowledge-agent-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KNOWLEDGE_AGENT_LIFECYCLE_LEDGER_PATH: /var/lib/knowledge-agent/source-lifecycle.jsonl
      TRUSSIUM_URL: ${TRUSSIUM_CONTAINER_URL:-http://host.docker.internal:9000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - knowledge-agent-lifecycle:/var/lib/knowledge-agent
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  knowledge-agent-postgres:
  knowledge-agent-lifecycle:
