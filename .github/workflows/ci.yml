name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: knowledge_agent
          POSTGRES_PASSWORD: knowledge_agent
          POSTGRES_DB: knowledge_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_agent -d knowledge_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://knowledge_agent:knowledge_agent@127.0.0.1:5432/knowledge_agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Enable pgvector for integration tests
        run: |
          uv run python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Validate local services
        run: docker compose --env-file .env.example config --quiet
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
